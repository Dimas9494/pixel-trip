[build]
  base    = "website"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION            = "20"
  VITE_EVOLVE_CONTRACT    = "0x1B174b30A0ABA50bd73aF305caDB01e23bfda0EC"
  EVOLVE_CONTRACT         = "0x1B174b30A0ABA50bd73aF305caDB01e23bfda0EC"
  MAINNET_RPC_URL         = "https://ethereum-rpc.publicnode.com"
  IMAGE_BASE_URL          = "https://pixeltripnft.website/stage2/images"
  STAGE1_META_BASE        = "https://pixeltripnft.website/metadata"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/burn/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
