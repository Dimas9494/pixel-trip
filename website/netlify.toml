[build]
  command = "node scripts/build-token-owners.mjs && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION            = "20"
  VITE_EVOLVE_CONTRACT    = "0x1B174b30A0ABA50bd73aF305caDB01e23bfda0EC"
  EVOLVE_CONTRACT         = "0x1B174b30A0ABA50bd73aF305caDB01e23bfda0EC"
  MAINNET_RPC_URL         = "https://rpc.mevblocker.io"
  IMAGE_BASE_URL          = "https://pixeltripnft.website/stage2/images"
  STAGE1_META_BASE        = "https://pixeltripnft.website/metadata"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/burn/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/api/wallet-tokens"
  to = "/.netlify/functions/wallet-tokens"
  status = 200

[[redirects]]
  from = "/api/gif-proxy"
  to = "/.netlify/functions/gif-proxy"
  status = 200

[[redirects]]
  from = "/api/opensea-refresh"
  to = "/.netlify/functions/opensea-refresh"
  status = 200
