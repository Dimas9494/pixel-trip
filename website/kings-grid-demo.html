<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PIXEL TRIP — King&apos;s Run (demo)</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a12;
        --panel: #12121f;
        --line: #2a2a4a;
        --text: #e8e8ff;
        --muted: #8888aa;
        --accent: #5cf0ff;
        --gold: #ffd54a;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        line-height: 1.6;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
        color: var(--accent);
      }
      .sub { color: var(--muted); margin: 0 0 16px; }
      .hud {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 12px;
      }
      .pill {
        background: var(--panel);
        border: 2px solid var(--line);
        padding: 8px 12px;
      }
      .pill span { color: var(--gold); }
      #game {
        display: block;
        width: 100%;
        max-width: 480px;
        aspect-ratio: 1;
        border: 4px solid var(--line);
        background: #000;
        image-rendering: pixelated;
        touch-action: none;
      }
      .controls { margin-top: 14px; color: var(--muted); }
      .controls kbd {
        background: var(--panel);
        border: 1px solid var(--line);
        padding: 2px 6px;
        color: var(--text);
      }
      button {
        font-family: inherit;
        font-size: 9px;
        background: var(--panel);
        color: var(--accent);
        border: 2px solid var(--accent);
        padding: 10px 14px;
        margin-top: 12px;
        cursor: pointer;
      }
      a { color: var(--accent); }
      .load { color: var(--muted); margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>KING&apos;S RUN</h1>
      <p class="sub">
        Управляй <strong>Full_Street_Ape_King</strong> — собирай короны, избегай пустоты. Stage 3 demo.
      </p>
      <p class="load" id="load">Loading trippers…</p>

      <div class="hud">
        <div class="pill">TIME <span id="time">45</span>s</div>
        <div class="pill">SCORE <span id="score">0</span></div>
        <div class="pill">CROWNS <span id="crowns">0</span></div>
      </div>

      <canvas id="game" width="480" height="480" tabindex="0" aria-label="King's Run"></canvas>
      <button type="button" id="restart">RESTART</button>

      <p class="controls">
        <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> или <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> — движение.
        На телефоне — перетаскивай палец по арене.
        <br /><a href="/burn.html">Evolution Lab</a>
      </p>
    </div>

    <img
      id="hero-src"
      src="https://pixeltripnft.website/stage3/images/Full_Street_Ape_King.gif"
      alt=""
      width="64"
      height="64"
      hidden
      crossorigin="anonymous"
    />

    <script>
      const W = 480;
      const H = 480;
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const heroImg = document.getElementById("hero-src");
      const timeEl = document.getElementById("time");
      const scoreEl = document.getElementById("score");
      const crownsEl = document.getElementById("crowns");
      const loadEl = document.getElementById("load");

      const keys = Object.create(null);
      const player = { x: W / 2, y: H / 2, r: 28, speed: 3.2 };
      let pickups = [];
      let score = 0;
      let crowns = 0;
      let timeLeft = 45;
      let running = false;
      let timerId = null;
      let touchId = null;
      let touchTarget = null;

      function rand(min, max) {
        return min + Math.random() * (max - min);
      }

      function spawnPickup() {
        if (pickups.length >= 12) return;
        pickups.push({
          x: rand(40, W - 40),
          y: rand(40, H - 40),
          type: Math.random() < 0.75 ? "crown" : "banana",
          pulse: Math.random() * Math.PI * 2,
        });
      }

      function drawGrid(t) {
        ctx.fillStyle = "#0c0c18";
        ctx.fillRect(0, 0, W, H);
        const step = 32;
        for (let y = 0; y < H; y += step) {
          for (let x = 0; x < W; x += step) {
            const alt = ((x / step + y / step) % 2) === 0;
            ctx.fillStyle = alt ? "#141428" : "#101020";
            ctx.fillRect(x, y, step, step);
          }
        }
        ctx.strokeStyle = "rgba(92, 240, 255, 0.15)";
        ctx.lineWidth = 2;
        ctx.strokeRect(4, 4, W - 8, H - 8);
      }

      function drawPickup(p) {
        const bob = Math.sin(p.pulse) * 3;
        const px = p.x;
        const py = p.y + bob;
        if (p.type === "crown") {
          ctx.fillStyle = "#ffd54a";
          ctx.fillRect(px - 8, py - 6, 16, 6);
          ctx.fillRect(px - 10, py, 20, 5);
          ctx.fillRect(px - 6, py - 12, 4, 6);
          ctx.fillRect(px - 2, py - 12, 4, 6);
          ctx.fillRect(px + 2, py - 12, 4, 6);
        } else {
          ctx.fillStyle = "#ffe066";
          ctx.fillRect(px - 10, py - 4, 18, 8);
          ctx.fillRect(px + 6, py - 8, 6, 6);
        }
      }

      function drawPlayer() {
        const size = 72;
        const dx = player.x - size / 2;
        const dy = player.y - size / 2;
        if (heroImg.complete && heroImg.naturalWidth) {
          ctx.drawImage(heroImg, dx, dy, size, size);
        } else {
          ctx.fillStyle = "#5cf0ff";
          ctx.fillRect(dx, dy, size, size);
        }
        ctx.strokeStyle = "rgba(255, 213, 74, 0.6)";
        ctx.lineWidth = 2;
        ctx.strokeRect(dx - 2, dy - 2, size + 4, size + 4);
      }

      function dist(a, b) {
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        return Math.hypot(dx, dy);
      }

      function update() {
        let vx = 0;
        let vy = 0;
        if (keys.ArrowUp || keys.w || keys.W) vy -= 1;
        if (keys.ArrowDown || keys.s || keys.S) vy += 1;
        if (keys.ArrowLeft || keys.a || keys.A) vx -= 1;
        if (keys.ArrowRight || keys.d || keys.D) vx += 1;

        if (touchTarget) {
          const dx = touchTarget.x - player.x;
          const dy = touchTarget.y - player.y;
          const len = Math.hypot(dx, dy) || 1;
          if (len > 8) {
            vx = dx / len;
            vy = dy / len;
          }
        }

        if (vx || vy) {
          const len = Math.hypot(vx, vy) || 1;
          player.x += (vx / len) * player.speed;
          player.y += (vy / len) * player.speed;
        }

        const pad = player.r;
        player.x = Math.max(pad, Math.min(W - pad, player.x));
        player.y = Math.max(pad, Math.min(H - pad, player.y));

        for (let i = pickups.length - 1; i >= 0; i--) {
          const p = pickups[i];
          p.pulse += 0.08;
          if (dist(player, p) < player.r + 14) {
            if (p.type === "crown") {
              score += 100;
              crowns += 1;
            } else {
              score += 40;
            }
            scoreEl.textContent = String(score);
            crownsEl.textContent = String(crowns);
            pickups.splice(i, 1);
            spawnPickup();
            spawnPickup();
          }
        }

        if (Math.random() < 0.02) spawnPickup();
      }

      function frame(t) {
        if (!running) return;
        update();
        drawGrid(t);
        for (const p of pickups) drawPickup(p);
        drawPlayer();
        requestAnimationFrame(frame);
      }

      function tick() {
        if (!running) return;
        timeLeft -= 1;
        timeEl.textContent = String(Math.max(0, timeLeft));
        if (timeLeft <= 0) {
          running = false;
          clearInterval(timerId);
          alert("Time! Score: " + score + " · Crowns: " + crowns);
        }
      }

      function startGame() {
        pickups = [];
        for (let i = 0; i < 8; i++) spawnPickup();
        player.x = W / 2;
        player.y = H / 2;
        score = 0;
        crowns = 0;
        timeLeft = 45;
        scoreEl.textContent = "0";
        crownsEl.textContent = "0";
        timeEl.textContent = "45";
        running = true;
        clearInterval(timerId);
        timerId = setInterval(tick, 1000);
        canvas.focus();
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (e) => {
        keys[e.key] = true;
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(e.key)) {
          e.preventDefault();
        }
      });
      window.addEventListener("keyup", (e) => {
        keys[e.key] = false;
      });

      canvas.addEventListener("pointerdown", (e) => {
        canvas.setPointerCapture(e.pointerId);
        touchId = e.pointerId;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        touchTarget = {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY,
        };
      });
      canvas.addEventListener("pointermove", (e) => {
        if (e.pointerId !== touchId) return;
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        const scaleY = H / rect.height;
        touchTarget = {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY,
        };
      });
      canvas.addEventListener("pointerup", (e) => {
        if (e.pointerId === touchId) {
          touchId = null;
          touchTarget = null;
        }
      });

      document.getElementById("restart").addEventListener("click", startGame);

      function boot() {
        loadEl.textContent = "";
        startGame();
      }

      if (heroImg.complete) boot();
      else {
        heroImg.onload = boot;
        heroImg.onerror = () => {
          loadEl.textContent = "GIF offline — placeholder square.";
          boot();
        };
      }
    </script>
  </body>
</html>
